            <span>Usuario</span>
            <div class="login-input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input name="usuario" id="login-user" type="text" placeholder="ENVIA" autocomplete="username" spellcheck="false" value="ENVIA" required>
            </div>
          </label>
          <label class="login-field">
            <span>Clave de acceso</span>
            <div class="login-input">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input name="password" id="login-pass" type="password" placeholder="•••••••••" autocomplete="current-password" value="123456789" required>
              <button type="button" id="toggle-pass" class="login-eye" aria-label="Mostrar clave">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </label>

          <div id="login-error" class="login-error hidden" role="alert"></div>

          <button type="submit" id="login-submit" class="login-submit">
            Ingresar
          </button>
        </form>

          <button type="button" id="btn-manual" class="login-btn-manual">Manual de usuario</button>
        </div>
